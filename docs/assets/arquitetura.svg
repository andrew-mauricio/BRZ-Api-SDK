<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="440" viewBox="0 0 1280 440" role="img" aria-labelledby="t d"><title id="t">Do SDK ao servidor</title><desc id="d">Headers e winmm.lib compilam seu plugin. A BRZ Api carrega o plugin no servidor ARK.</desc><defs><marker id="a" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto"><path d="M0 0L9 5L0 10" fill="none" stroke="#5edbbd" stroke-width="2"/></marker></defs><rect width="1280" height="440" rx="24" fill="#101c22"/><g font-family="Arial,sans-serif"><text x="48" y="62" fill="#edf8f5" font-size="30" font-weight="700">DO HEADER AO PLUGIN</text><text x="48" y="96" fill="#a8b9be" font-size="18">Desenvolva em C++ · compile em x64 · execute com a BRZ Api</text><g fill="#192d34" stroke="#31545b" stroke-width="2"><rect x="48" y="148" width="250" height="168" rx="16"/><rect x="360" y="148" width="250" height="168" rx="16"/><rect x="672" y="148" width="250" height="168" rx="16"/><rect x="984" y="148" width="248" height="168" rx="16"/></g><g fill="#67e8ba" font-size="25" font-weight="700"><text x="72" y="192">BRZ SDK</text><text x="384" y="192">SEU PLUGIN</text><text x="696" y="192">BRZ API</text><text x="1008" y="192">ARK ASA</text></g><g fill="#d5e2e5" font-size="18"><text x="72" y="233">include/ + winmm.lib</text><text x="72" y="270">Exemplos e contratos</text><text x="384" y="233">Visual Studio · C++17</text><text x="384" y="270">DLL + configuração</text><text x="696" y="233">Motor winmm.dll</text><text x="696" y="270">Carrega e resolve</text><text x="1008" y="233">Servidor dedicado</text><text x="1008" y="270">Build correspondente</text></g><g stroke="#5edbbd" stroke-width="3" marker-end="url(#a)"><path d="M310 237H343"/><path d="M622 237H655"/><path d="M933 237H966"/></g><text x="48" y="380" fill="#a8b9be" font-size="18">Este repositório distribui o SDK. O motor de execução é um componente separado.</text></g></svg>